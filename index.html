<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Инструкции</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Экран авторизации -->
  <div id="login-screen" class="login-screen">
    <div class="login-form">
      <h2>Вход</h2>
      <input type="text" id="login" placeholder="Логин" />
      <input type="password" id="password" placeholder="Пароль" />
      <button id="login-btn">Войти</button>
      <div id="login-error" class="error"></div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div id="main-app" class="hidden">
    <aside class="sidebar">
        <div class="site-title">Инструкция по шагам...</div>
            <div class="group-item home-link" data-id="favorites">
                🏠 Главная
            </div>
            <div class="group-list" id="group-list">
                <!-- Группы будут добавлены через JS -->
            </div>
        <button id="add-group-btn" class="btn-add">+ Новая группа</button>
    </aside>

    <main class="main-content">
      <header class="header">
        <h2 id="group-title">Выберите группу</h2>
        <button id="add-instruction-btn" class="btn-add">+ Добавить инструкцию</button>
      </header>
      <div class="instructions-list" id="instructions-list">
        <!-- Список инструкций -->
      </div>
    </main>
  </div>

  <!-- Модальное окно редактора -->
  <div id="editor-modal" class="modal hidden">
    <div class="modal-content">
        <h3 id="editor-title">Новая инструкция</h3>
        <input type="text" id="instruction-name" placeholder="Название инструкции" />
        <textarea id="instruction-content" placeholder="HTML содержимое инструкции"></textarea>
        
        <!-- Новая кнопка загрузки -->
        <button id="upload-html-btn" type="button">📁 Загрузить HTML-файл</button>
        <input type="file" id="html-file-input" accept=".html,.htm" style="display: none;" />
        
        <div class="modal-actions">
        <button id="save-instruction-btn">Сохранить</button>
        <button id="cancel-instruction-btn">Отмена</button>
        </div>
    </div>
    </div>

  <!-- Модальное окно группы -->
  <div id="group-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Новая группа</h3>
      <input type="text" id="group-name" placeholder="Название группы" />
      <div class="modal-actions">
        <button id="save-group-btn">Создать</button>
        <button id="cancel-group-btn">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Превью инструкции -->
  <div id="preview-modal" class="modal hidden">
    <div class="modal-content preview">
      <h3 id="preview-title">Инструкция</h3>
      <div id="preview-content"></div>
      <button id="close-preview-btn">Закрыть</button>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
